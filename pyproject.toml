[project]
name = "aionos-assignment"
version = "1.0.0"
description = "Airline Disruption Resolution Agent - AI-powered customer support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1.4",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
start-agent = "aionos_assignment.api.main:app"
seed-db = "aionos_assignment.db.seed:seed"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
